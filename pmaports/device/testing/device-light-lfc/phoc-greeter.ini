[output:DSI-1]
# rotation comes from the kernel panel orientation (DT rotation = <90>)
drm-panel-orientation = true
# the login screen (phrog) at 200 %: its keypad and unlock button need the 540 px of height that
# 250 % (432) doesn't leave. phrog-greetd-session prefers this file to phosh's phoc.ini
scale = 2
