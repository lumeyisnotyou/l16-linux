[output:DSI-1]
# rotation comes from the kernel panel orientation (DT rotation = <90>)
drm-panel-orientation = true
# 250 % (768 x 432 logical px). Nebula fits its layout to any scale (fit.rs) and phosh's lock screen
# fits it side by side (lockscreen.c, set_unlock_wide). The phrog login screen keeps 200 %
# (phoc-greeter.ini): its unlock button doesn't fit the 432 px.
scale = 2.5
